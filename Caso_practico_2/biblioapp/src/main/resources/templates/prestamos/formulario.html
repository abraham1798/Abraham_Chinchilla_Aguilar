<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head('Registrar préstamo')}"></head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">Registrar préstamo</h2>

    <form th:action="@{/prestamos/guardar}" method="post">

        <div class="mb-3">
            <label class="form-label">Libro</label>

            <select name="libroId" class="form-select" required>
                <option value="">Seleccione un libro</option>

                <option th:each="libro : ${libros}"
                        th:value="${libro.id}"
                        th:text="${libro.titulo + ' - ' + libro.copiasDisponibles + ' disponibles'}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Usuario</label>

            <select name="usuarioId" class="form-select" required>
                <option value="">Seleccione un usuario</option>

                <option th:each="usuario : ${usuarios}"
                        th:value="${usuario.id}"
                        th:text="${usuario.nombreCompleto + ' - ' + usuario.username}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">
            Registrar préstamo
        </button>

        <a th:href="@{/prestamos}" class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
