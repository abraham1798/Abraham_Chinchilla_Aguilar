<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head('Libro')}"></head>

<body>

<div class="container mt-5">

    <h2 class="mb-4"
        th:text="${libro.id == null ? 'Registrar libro' : 'Editar libro'}">
        Libro
    </h2>

    <form th:action="@{/libros/guardar}"
          th:object="${libro}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text"
                   th:field="*{titulo}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Autor</label>
            <input type="text"
                   th:field="*{autor}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">ISBN</label>
            <input type="text"
                   th:field="*{isbn}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <input type="text"
                   th:field="*{categoria}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Copias totales</label>
            <input type="number"
                   th:field="*{copiasTotales}"
                   class="form-control"
                   min="1"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Copias disponibles</label>
            <input type="number"
                   th:field="*{copiasDisponibles}"
                   class="form-control"
                   min="0"
                   required>
        </div>

        <button type="submit" class="btn btn-primary">
            Guardar
        </button>

        <a th:href="@{/libros}" class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
